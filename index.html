<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manohoraga - Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding: 30px 20px;
      background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .main-wrapper {
      max-width: 950px;
      margin: 0 auto;
    }

    /* TOPO: Avatar, Nome, Bio e Botão de Editar */
    .profile-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .profile-left-side {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-avatar {
      width: 65px;
      height: 65px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid #444;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .profile-avatar:hover {
      transform: scale(1.05);
      border-color: #ff1e38;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }

    .verified-badge {
      width: 18px;
      height: 18px;
      background-color: #0095f6;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 10px;
      font-weight: bold;
    }

    .profile-bio {
      font-size: 13px;
      color: #bbb;
      letter-spacing: 1px;
    }

    /* Botão de Editar Perfil (Oculto por padrão) */
    .owner-edit-btn {
      display: none;
      background: #ff1e38;
      color: #fff;
      border: none;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .owner-edit-btn:hover {
      background: #e0122d;
    }

    /* ESTRUTURA EM 2 COLUNAS */
    .profile-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .content-left {
      flex: 1;
    }

    /* Galeria Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .gallery-item img, .gallery-item video {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .gallery-item img:hover, .gallery-item video:hover {
      transform: scale(1.03);
      border-color: #ff1e38;
    }

    /* COLUNA DIREITA: PAINEL LATERAL STEAM */
    .sidebar-right {
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .status-text {
      color: #c0c8d0;
      font-size: 15px;
    }

    .badges-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .badges-header {
      font-size: 14px;
      color: #c0c8d0;
    }

    .badges-header span {
      color: #fff;
      font-weight: bold;
    }

    .badges-icons {
      display: flex;
      gap: 8px;
    }

    .badge-icon {
      width: 36px;
      height: 36px;
      background: rgba(17, 17, 17, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-item {
      color: #eaeaea;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
      display: block;
    }

    .nav-item:hover {
      color: #0095f6;
    }

    /* Botão POSTAR (Oculto por padrão) */
    .sidebar-post-btn {
      display: none;
      background: #0095f6;
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 5px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .sidebar-post-btn:hover {
      background: #0077c5;
    }

    /* MODAL DE ZOOM DE IMAGEM */
    .image-zoom-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      z-index: 1002;
    }

    .image-zoom-content {
      position: relative;
      max-width: 650px;
      width: 90%;
      text-align: center;
    }

    .image-zoom-content img, .image-zoom-content video {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #333;
    }

    /* POP-UPS GERAIS (MODALS) */
    .custom-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1001;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-box {
      background: #111;
      border: 1px solid #333;
      padding: 25px;
      border-radius: 8px;
      max-width: 450px;
      width: 100%;
      color: #fff;
      position: relative;
    }

    .modal-box h3 {
      font-size: 17px;
      margin-bottom: 15px;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
      color: #ff1e38;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      color: #aaa;
    }

    .form-group input, .form-group select {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .action-btn {
      background: #ff1e38;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      width: 100%;
      margin-top: 5px;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #e0122d;
    }

    .post-action-btn {
      background: #0095f6;
    }

    .post-action-btn:hover {
      background: #0077c5;
    }

    .delete-list {
      max-height: 140px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px;
      margin-top: 10px;
    }

    .delete-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #262626;
      font-size: 12px;
    }

    .delete-item:last-child {
      border-bottom: none;
    }

    .btn-del {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }

    /* Pop-up de Anúncio */
    .ad-modal {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1003;
    }

    .ad-content {
      background: #111;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 8px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      position: relative;
      color: #fff;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .close-btn:hover {
      background: #ff1e38;
      border-color: #ff1e38;
    }

    .ad-banner {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
      margin-top: 10px;
    }

    .ad-btn {
      display: block;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <!-- Topo do Perfil -->
    <div class="profile-top">
      <div class="profile-left-side">
        <img src="https://via.placeholder.com/65/222/fff?text=M" alt="Avatar" class="profile-avatar" id="avatarImg" onclick="openZoomModal(this.src, 'img')" title="Clique para ver a foto de perto">
        <div class="profile-info">
          <div class="name-row">
            <h1 class="profile-name" id="displayName">Manohoraga</h1>
            <div class="verified-badge" title="Verificado">✓</div>
          </div>
          <div class="profile-bio" id="displayBio">† 𝔐𝔞𝔫𝔬𝔥𝔬𝔯𝔞𝔤𝔞 †</div>
        </div>
      </div>

      <!-- Botão de Editar Perfil (Oculto por padrão) -->
      <button class="owner-edit-btn" id="editBtn" onclick="openEditProfileModal()">⚙️ Editar Perfil</button>
    </div>

    <!-- Layout em Duas Colunas -->
    <div class="profile-layout">
      
      <!-- Coluna da Esquerda: Galeria -->
      <div class="content-left">
        <h2 id="galleryTitle" style="font-size: 16px; color: #c0c8d0; margin-bottom: 10px;">Fotos</h2>
        <div class="gallery-grid" id="galleryGrid">
          <!-- Conteúdo dinâmico da galeria -->
        </div>
      </div>

      <!-- Coluna da Direita: Painel Lateral Steam -->
      <div class="sidebar-right">
        <div class="status-text" id="displayStatus">Currently Offline</div>

        <div class="badges-block">
          <div class="badges-header">Badges <span id="displayBadges">53</span></div>
          <div class="badges-icons">
            <div class="badge-icon">💀</div>
            <div class="badge-icon">⚔️</div>
            <div class="badge-icon">👑</div>
            <div class="badge-icon">🐉</div>
          </div>
        </div>

        <div class="nav-links">
          <a class="nav-item" onclick="switchTab('games', 'Games')">Games</a>
          <a class="nav-item" onclick="switchTab('inventory', 'Inventory')">Inventory</a>
          <a class="nav-item" onclick="switchTab('screenshots', 'Screenshots')">Screenshots</a>
          <a class="nav-item" onclick="switchTab('videos', 'Videos')">Videos</a>
          <a class="nav-item" onclick="switchTab('fotos', 'Fotos')">Fotos</a>
          
          <!-- Botão Postar (Oculto por padrão) -->
          <button class="sidebar-post-btn" id="postBtn" onclick="openPostModal()">
            <span>➕</span> Postar
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- TELA DE ZOOM PARA FOTO/VÍDEO -->
  <div class="image-zoom-modal" id="zoomModal">
    <div class="image-zoom-content" id="zoomContentContainer">
      <button class="close-btn" onclick="closeZoomModal()" style="top: -35px; right: 0; z-index: 1004;">Fechar</button>
    </div>
  </div>

  <!-- PAINEL 1: EDITAR PERFIL -->
  <div class="custom-modal" id="editProfileModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeEditProfileModal()">Fechar</button>
      <h3>Editar Perfil</h3>
      <div class="form-group">
        <label>Nome do Perfil:</label>
        <input type="text" id="editName" value="Manohoraga">
      </div>
      <div class="form-group">
        <label>Subtítulo / Bio:</label>
        <input type="text" id="editBio" value="† 𝔐𝔞𝔫𝔬𝔥𝔬𝔯𝔞𝔤𝔞 †">
      </div>
      <div class="form-group">
        <label>Status:</label>
        <input type="text" id="editStatus" value="Currently Offline">
      </div>
      <div class="form-group">
        <label>Escolher Nova Foto de Perfil (do PC):</label>
        <input type="file" id="uploadAvatarFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>Escolher Plano de Fundo (do PC):</label>
        <input type="file" id="uploadBgFile" accept="image/*">
      </div>
      <button class="action-btn" onclick="saveProfileChanges()">Salvar Alterações</button>
    </div>
  </div>

  <!-- PAINEL 2: POSTAR E GERENCIAR MÍDIAS -->
  <div class="custom-modal" id="postModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closePostModal()">Fechar</button>
      <h3>Postar Nova Mídia</h3>
      <div class="form-group">
        <label>Selecionar Foto/Vídeo do Computador:</label>
        <input type="file" id="uploadMediaFile" accept="image/*,video/*">
      </div>
      <div class="form-group">
        <label>Escolher Categoria:</label>
        <select id="mediaCategory">
          <option value="fotos">Fotos</option>
          <option value="screenshots">Screenshots</option>
          <option value="videos">Videos</option>
          <option value="games">Games</option>
          <option value="inventory">Inventory</option>
        </select>
      </div>
      <button class="action-btn post-action-btn" onclick="postNewMedia()">Publicar na Categoria</button>

      <h3 style="margin-top: 20px;">Gerenciar / Excluir Postagens</h3>
      <div class="delete-list" id="deleteListContainer">
        <!-- Lista de exclusão -->
      </div>
    </div>
  </div>

  <!-- Pop-up de Anúncio -->
  <div class="ad-modal" id="adModal">
    <div class="ad-content">
      <button class="close-btn" onclick="closeAd()">Fechar</button>
      <img src="https://via.placeholder.com/300x160/222/fff?text=Anúncio" alt="Anúncio" class="ad-banner">
      <h3 style="font-size: 16px; margin-bottom: 6px;">Anúncio Destaque</h3>
      <p style="font-size: 12px; color: #aaa;">Clique para acessar a oferta especial.</p>
      <a href="https://seu-link-de-afiliado-ou-anuncio.com" target="_blank" class="ad-btn">CONFIRA AGORA</a>
    </div>
  </div>

  <script>
    let mediaData = JSON.parse(localStorage.getItem('manohoraga_medias')) || {
      'fotos': [],
      'screenshots': [],
      'videos': [],
      'games': [],
      'inventory': []
    };

    let profileData = JSON.parse(localStorage.getItem('manohoraga_profile')) || {
      name: 'Manohoraga',
      bio: '† 𝔐𝔞𝔫𝔬𝔥𝔬𝔯𝔞𝔤𝔞 †',
      status: 'Currently Offline',
      avatar: 'https://via.placeholder.com/65/222/fff?text=M',
      bg: ''
    };
    
    let currentTab = 'fotos';

    window.onload = function() {
      applyProfileData();
      // O site começa SEMPRE limpo. Exige sempre o atalho para entrar como admin.
      localStorage.removeItem('manohoraga_admin');
      renderGallery('fotos');
    };

    function applyProfileData() {
      document.getElementById('displayName').innerText = profileData.name;
      document.getElementById('displayBio').innerText = profileData.bio;
      document.getElementById('displayStatus').innerText = profileData.status;
      document.getElementById('avatarImg').src = profileData.avatar;
      if (profileData.bg) {
        document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${profileData.bg}')`;
      }
    }

    // ATALHO SECRETO: Ctrl + Seta Baixo + Seta Cima
    let ctrlPressed = false;
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Control') ctrlPressed = true;
      if (ctrlPressed) {
        if (e.key === 'ArrowDown') window.downPressed = true;
        if (e.key === 'ArrowUp' && window.downPressed) {
          window.downPressed = false;
          triggerSecretAdminLogin();
        }
      }
    });

    document.addEventListener('keyup', function(e) {
      if (e.key === 'Control') ctrlPressed = false;
    });

    function triggerSecretAdminLogin() {
      const user = prompt("Digite o nome de usuário:");
      if (user === null) return;
      if (user !== "casthiel") {
        alert("Usuário incorreto!");
        return;
      }
      const senha = prompt("Digite a senha:");
      if (senha === null) return;
      if (senha === "12345678910casthielkymirgabriel@") {
        enableAdminMode();
        alert("Modo administrador ativado com sucesso!");
      } else {
        alert("Senha incorreta!");
      }
    }

    function enableAdminMode() {
      document.getElementById('editBtn').style.display = 'flex';
      document.getElementById('postBtn').style.display = 'flex';
    }

    function closeAd() {
      document.getElementById('adModal').style.display = 'none';
    }

    function openZoomModal(src, type) {
      const container = document.getElementById('zoomContentContainer');
      if (type === 'video') {
        container.innerHTML = `<button class="close-btn" onclick="closeZoomModal()" style="top: -35px; right: 0; z-index: 1004;">Fechar</button><video src="${src}" controls autoplay style="width:100%; max-height:80vh; border-radius:8px;"></video>`;
      } else {
        container.innerHTML = `<button class="close-btn" onclick="closeZoomModal()" style="top: -35px; right: 0; z-index: 1004;">Fechar</button><img src="${src}" alt="Zoom">`;
      }
      document.getElementById('zoomModal').style.display = 'flex';
      document.getElementById('adModal').style.display = 'flex';
    }

    function closeZoomModal() {
      document.getElementById('zoomModal').style.display = 'none';
    }

    function openEditProfileModal() {
      document.getElementById('editName').value = profileData.name;
      document.getElementById('editBio').value = profileData.bio;
      document.getElementById('editStatus').value = profileData.status;
      document.getElementById('editProfileModal').style.display = 'flex';
    }

    function closeEditProfileModal() {
      document.getElementById('editProfileModal').style.display = 'none';
    }

    function saveProfileChanges() {
      profileData.name = document.getElementById('editName').value || profileData.name;
      profileData.bio = document.getElementById('editBio').value || profileData.bio;
      profileData.status = document.getElementById('editStatus').value || profileData.status;

      const avatarFile = document.getElementById('uploadAvatarFile').files[0];
      const bgFile = document.getElementById('uploadBgFile').files[0];

      let pendingReads = 0;

      if (avatarFile) {
        pendingReads++;
        const reader = new FileReader();
        reader.onload = function(e) {
          profileData.avatar = e.target.result;
          pendingReads--;
          checkFinishSave();
        };
        reader.readAsDataURL(avatarFile);
      }

      if (bgFile) {
        pendingReads++;
        const readerBg = new FileReader();
        readerBg.onload = function(e) {
          profileData.bg = e.target.result;
        pendingReads--;
          checkFinishSave();
        };
        readerBg.readAsDataURL(bgFile);
      }

      if (pendingReads === 0) {
        checkFinishSave();
      }
    }

    function checkFinishSave() {
      localStorage.setItem('manohoraga_profile', JSON.stringify(profileData));
      applyProfileData();
      closeEditProfileModal();
      alert("Perfil atualizado com sucesso!");
    }

    function openPostModal() {
      renderDeleteList();
      document.getElementById('postModal').style.display = 'flex';
    }

    function closePostModal() {
      document.getElementById('postModal').style.display = 'none';
    }

    function postNewMedia() {
      const mediaFile = document.getElementById('uploadMediaFile').files[0];
      const category = document.getElementById('mediaCategory').value;

      if (!mediaFile) {
        alert("Por favor, selecione uma foto ou vídeo do seu computador!");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const isVideo = mediaFile.type.startsWith('video');
        mediaData[category].push({ src: e.target.result, type: isVideo ? 'video' : 'img' });
        
        localStorage.setItem('manohoraga_medias', JSON.stringify(mediaData));

        if (currentTab === category) {
          renderGallery(currentTab);
        }

        alert("Mídia postada com sucesso!");
        document.getElementById('uploadMediaFile').value = '';
        renderDeleteList();
        closePostModal();
      };
      reader.readAsDataURL(mediaFile);
    }

    function renderDeleteList() {
      const container = document.getElementById('deleteListContainer');
      container.innerHTML = '';
      
      let count = 0;
      for (let cat in mediaData) {
        mediaData[cat].forEach((item, index) => {
          count++;
          container.innerHTML += `
            <div class="delete-item">
              <span>Item #${count} (${cat})</span>
              <button class="btn-del" onclick="deleteMedia('${cat}', ${index})">Excluir</button>
            </div>
          `;
        });
      }
      
      if (count === 0) {
        container.innerHTML = `<span style="font-size:11px; color:#777;">Nenhuma mídia para gerenciar.</span>`;
      }
    }

    function deleteMedia(category, index) {
      mediaData[category].splice(index, 1);
      localStorage.setItem('manohoraga_medias', JSON.stringify(mediaData));
      renderDeleteList();
      renderGallery(currentTab);
    }

    function switchTab(tabKey, tabName) {
      currentTab = tabKey;
      document.getElementById('galleryTitle').innerText = tabName;
      renderGallery(tabKey);
    }

    function renderGallery(type) {
      const grid = document.getElementById('galleryGrid');
      const items = mediaData[type];

      if (!items || items.length === 0) {
        grid.innerHTML = `<p style="color: #888; font-size: 13px; grid-column: 1/-1;">Nenhum item nesta seção ainda.</p>`;
        return;
      }

      grid.innerHTML = '';
      items.forEach(item => {
        if (item.type === 'video') {
          grid.innerHTML += `
            <div class="gallery-item">
              <video src="${item.src}" onclick="openZoomModal('${item.src}', 'video')"></video>
            </div>
          `;
        } else {
          grid.innerHTML += `
            <div class="gallery-item">
              <img src="${item.src}" onclick="openZoomModal('${item.src}', 'img')" alt="Mídia">
            </div>
          `;
        }
      });
